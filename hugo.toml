baseURL = 'https://ohakn.dev/'
theme = 'HugoTeX'
languageCode = 'en-us'
title = 'ohakn'
DefaultContentLanguage = 'en'
enableInlineShortcodes = true
footnoteReturnLinkContents = '^'

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[pagination]
pagerSize = 3

[Params]
lightmode = true
dateformat = 'January 02, 2006'

[Params.author]
  name = 'Ola Håkansson'
  abstract = """
  Code Connoisseur and Linux Adventurer in Sweden.
  """

[taxonomies]
  category = 'categories'
  tag = 'tags'
  series = 'series'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = 'nord'

